[package]
name = "felidae_classifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "felidae_classifier"
crate-type = ["lib"]

[[bin]]
name = "server"
path = "src/server/main.rs"

[dependencies]
image = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
rayon = "1"
thiserror = "2"
tensorboard-rs = "0.5.9"

tokio = { version = "1", features = ["full"] }
axum = "0.8"
